[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cohort"]

[project]
name = "cohort"
version = "1.0.0"
requires-python = ">=3.10"
authors = [{ name = "Paul Zeinaty", email = "zeinatypol@gmail.com" }]
maintainers = [{ name = "Paul Zeinaty", email = "zeinatypol@gmail.com" }]
description = "A transparent chain-of-command multi-agent RL environment: ranked military agents that obey, report, and command in a human-readable order language."
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["reinforcement-learning", "multi-agent", "pettingzoo", "command-and-control", "marl"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "numpy>=1.24",
  "gymnasium>=0.29",
  "pettingzoo>=1.24",
  "torch>=2.0",
  "matplotlib>=3.7",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]
tb = ["tensorboard>=2.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["legacy", ".venv", "runs"]

[tool.ruff]
line-length = 120
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "SIM108"]

[tool.ruff.lint.pydocstyle]
convention = "google"
